// Andromarchy: Omarchy (Arch Linux ARM + Hyprland) on Android in one APK, without root or proot.
// Base: lfdevs/anland-termux's display app (GPL-3.0, see LICENSE-anland-termux / UPSTREAM-anland-termux.txt), run
// as its own app: the Andromarchy daemon and the Arch launcher are built with the NDK and shipped as native libraries.
plugins {
    id "com.android.application" version "9.4.0"
}

android {
    namespace = "andro.marchy" // Java package of the imported code, kept to limit the diff with upstream
    compileSdk = 36

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    defaultConfig {
        applicationId = "andro.marchy" // short: the app's files path ends up in 108-byte Unix socket paths
        // targetSdk 28: Android only lets apps targeting <= 28 execute files from their own data dir (W^X), which
        // running the Arch rootfs needs. Hence distribution outside the Play Store.
        // Android 11+: the Andromarchy native code needs API 30 (memfd_create). minSdk above targetSdk only draws a
        // Gradle warning; Android installs and runs such apps.
        minSdk = 30
        targetSdk = 28
        versionCode = 1
        versionName = "0.1.0"
        // The imported code also has a "compatible" transport (Binder bridge from a separate Termux); here the
        // daemon runs in this app, so the display connects to its socket directly.
        buildConfigField "boolean", "COMPATIBLE", "false"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // The Andromarchy native code uses memfd_create, declared by bionic from API 30 (Android 11).
                arguments "-DANDROID_STL=none", "-DANDROID_PLATFORM=android-30"
            }
        }
    }

    ndkVersion = "28.2.13676358"

    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
        }
    }

    packaging {
        jniLibs {
            // Extracted to nativeLibraryDir, which is executable: the daemon and the launcher run from there.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    lint {
        // Imported code calls API 30+ methods behind runtime checks; targetSdk 28 is deliberate (see above).
        abortOnError = false
    }
}

// Executables the app runs, built with the NDK and shipped as lib*.so so that Android extracts them to the
// executable nativeLibraryDir: the Andromarchy display daemon, lotfix-run (the Arch launcher, ../native/launcher) and
// the termux-va video daemon. Entries starting with "-" are compiler/linker flags.
// 16 KB-aligned segments for Android 15+ devices with 16 KB pages.
def jniOut = file("src/main/jniLibs/arm64-v8a")
def executables = [
    "libandromarchy.so"   : ["native/andromarchy/andromarchy.c", "native/andromarchy/common/socket_utils.c"],
    "liblotfixrun.so": ["../native/launcher/lotfix-run.c"],
    // termux-va (lfdevs, GPL-3.0): MediaCodec hardware video for the VA-API of Mesa's termuxva bridge
    "libtermuxva.so" : ["../third_party/termux-va/daemon/termux-va.c", "-std=c11",
                        "-I../third_party/termux-va/common", "-lmediandk", "-llog", "-landroid"],
]
tasks.register("buildExecutables") {
    inputs.files(executables.values().flatten())
    outputs.dir(jniOut)
    doLast {
        def host = System.getProperty("os.name").toLowerCase().contains("windows") ? "windows-x86_64" :
                   System.getProperty("os.name").toLowerCase().contains("mac") ? "darwin-x86_64" : "linux-x86_64"
        def ndk = androidComponents.sdkComponents.ndkDirectory.get().asFile
        def clang = "${ndk}/toolchains/llvm/prebuilt/${host}/bin/aarch64-linux-android30-clang" +
                    (host == "windows-x86_64" ? ".cmd" : "")
        jniOut.mkdirs()
        executables.each { name, srcs ->
            def proc = ([clang, "-O2", "-Wall", "-pie", "-Wl,-z,max-page-size=16384",
                         "-o", new File(jniOut, name).path] + srcs.collect { it.startsWith("-I") ? "-I" + file(it.substring(2)).path : it.startsWith("-") ? it : file(it).path }).execute()
            proc.waitForProcessOutput(System.out, System.err)
            if (proc.exitValue() != 0)
                throw new GradleException("NDK build of ${name} failed")
        }
    }
}
tasks.named("preBuild") { dependsOn("buildExecutables") }

