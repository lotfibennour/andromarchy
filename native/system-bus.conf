<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Android/Andromarchy: the "system" bus of the session (SessionService starts it on run/system_bus). The stock
     system policy keys on real uids, and every process here is the app's Android uid, so it is permissive like a
     session bus. It carries the services that stand in for the hardware ones (android-upower...). -->
<busconfig>
  <type>system</type>
  <listen>unix:tmpdir=/tmp</listen> <!-- required; SessionService passes the real one (address option) -->
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
  </policy>
</busconfig>
