<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromarchy Linux - Splash Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'OmarchyFont';
      src: url('https://tinker.markcuda.com/omarchy-font/omarchy-font.ttf?v=2.1') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      background-color: #0c0d14;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .omarchy-title {
      font-family: 'OmarchyFont', 'JetBrains Mono', monospace;
      letter-spacing: 0.12em;
    }

    /* CRT Scanline effect */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Vignette effect */
    .vignette {
      background: radial-gradient(circle at center, transparent 40%, rgba(5, 6, 10, 0.85) 100%);
      pointer-events: none;
    }

    /* Dot matrix background */
    .dot-grid {
      background-image: radial-gradient(rgba(156, 212, 98, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Animated Glow & Pulse */
    @keyframes textGlowPulse {
      0%, 100% {
        text-shadow: 
          0 0 10px rgba(156, 212, 98, 0.6),
          0 0 25px rgba(156, 212, 98, 0.4),
          0 0 50px rgba(156, 212, 98, 0.2);
        opacity: 0.96;
        transform: scale(1);
      }
      50% {
        text-shadow: 
          0 0 18px rgba(156, 212, 98, 0.95),
          0 0 45px rgba(156, 212, 98, 0.7),
          0 0 80px rgba(156, 212, 98, 0.35);
        opacity: 1;
        transform: scale(1.015);
      }
    }

    /* Retro Flicker & Scan effect */
    @keyframes screenFlicker {
      0% { opacity: 0.98; }
      4% { opacity: 0.92; }
      8% { opacity: 0.99; }
      15% { opacity: 0.88; }
      19% { opacity: 0.99; }
      55% { opacity: 0.97; }
      60% { opacity: 0.93; }
      65% { opacity: 1; }
      100% { opacity: 0.98; }
    }

    /* CRT beam sweep */
    @keyframes beamSweep {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    /* Typewriter / Decrypt reveal effect */
    @keyframes logoReveal {
      0% {
        opacity: 0;
        filter: blur(12px) brightness(2);
        transform: scale(0.92);
        letter-spacing: 0.35em;
      }
      40% {
        opacity: 0.8;
        filter: blur(4px) brightness(1.5);
      }
      100% {
        opacity: 1;
        filter: blur(0px) brightness(1);
        transform: scale(1);
        letter-spacing: 0.12em;
      }
    }

    .animate-logo-reveal {
      animation: logoReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 textGlowPulse 3s ease-in-out 1.6s infinite;
    }

    .beam-line {
      animation: beamSweep 8s linear infinite;
    }

    .flicker-layer {
      animation: screenFlicker 0.2s infinite;
    }

    /* Custom blinking cursor */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 0.85s infinite;
    }

    /* Progress bar animation */
    @keyframes progressLoad {
      0% { width: 0%; }
      20% { width: 28%; }
      45% { width: 42%; }
      70% { width: 78%; }
      90% { width: 92%; }
      100% { width: 100%; }
    }
    .splash-progress-fill {
      animation: progressLoad 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Fade-in staggered elements */
    @keyframes fadeInDelay {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-step-1 { animation: fadeInDelay 0.8s ease-out 0.4s forwards; opacity: 0; }
    .fade-step-2 { animation: fadeInDelay 0.8s ease-out 1.2s forwards; opacity: 0; }
    .fade-step-3 { animation: fadeInDelay 0.8s ease-out 1.8s forwards; opacity: 0; }
  </style>
</head>
<body class="min-h-screen w-full relative flex flex-col items-center justify-between text-slate-300 selection:bg-[#9cd462] selection:text-[#0c0d14]">

  <!-- Ambient Background Canvas & Grid -->
  <div class="absolute inset-0 dot-grid opacity-35 pointer-events-none"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(156,212,98,0.08)_0%,_transparent_65%)] pointer-events-none"></div>

  <!-- CRT Scanlines, Beam Sweep & Vignette Overlays -->
  <div class="absolute inset-0 scanlines z-20"></div>
  <div class="absolute inset-0 vignette z-20"></div>
  <div class="absolute inset-x-0 h-24 bg-gradient-to-b from-transparent via-[#9cd462]/10 to-transparent beam-line z-20 pointer-events-none opacity-40"></div>

  <!-- Top Status Bar (Mobile & Embedded Android Shell) -->

  <!-- Center Hero: Animated Green Text Logo -->
  <main class="relative z-30 flex-1 flex flex-col items-center justify-center px-4 w-full max-w-2xl text-center">
    
    <!-- Subtitle Prompt & Decorative Terminal Bracket -->
    <div class="fade-step-1 mb-5 flex items-center gap-2 text-xs md:text-sm text-[#9cd462]/75 tracking-widest uppercase">
      <span class="opacity-60">&lt;</span>
      <span class="font-bold text-[#9cd462]">INIT_RUNNER</span>
      <span class="text-slate-500">::</span>
      <span class="text-slate-400">ARCH LINUX ON ANDROID</span>
      <span class="opacity-60">&gt;</span>
    </div>

    <!-- The Primary Animated Green Text Logo -->
    <div class="relative py-4 px-2 overflow-visible flicker-layer">
      <!-- Glow Underlay -->
      <div class="absolute inset-0 flex items-center justify-center blur-2xl opacity-45 pointer-events-none">
        <h1 class="omarchy-title text-4xl sm:text-6xl md:text-7xl font-normal text-[#9cd462]">
          ANDROMARCHY
        </h1>
      </div>

      <!-- Core Animated Wordmark -->
      <h1 id="splashLogo" class="omarchy-title text-4xl sm:text-6xl md:text-7xl font-normal text-[#9cd462] tracking-wider animate-logo-reveal select-none drop-shadow-[0_2px_12px_rgba(156,212,98,0.45)]">
        ANDROMARCHY
      </h1>
    </div>

    <!-- OS Release Tag & Interactive CLI status -->
    <div class="fade-step-2 mt-4 flex flex-col items-center gap-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-[#161a24] border border-[#9cd462]/30 shadow-[0_0_12px_rgba(156,212,98,0.15)] text-xs text-[#9cd462]">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y1="19"></line>
        </svg>
        <span class="font-bold tracking-wide">v1.4.2-rolling</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-300">Tokyo Night Edition</span>
      </div>

      <!-- Live Initialization Telemetry Status Ticker -->
      <p id="bootStatusText" class="text-xs text-slate-400 font-mono tracking-tight h-5 mt-2 flex items-center">
        <span class="text-[#9cd462] mr-2">›</span>
        <span id="typewriterText">Initializing hardware bridge & Wayland socket...</span>
        <span class="inline-block w-1.5 h-3.5 bg-[#9cd462] ml-1 cursor-blink"></span>
      </p>
    </div>

    <!-- Glowing Progress Bar Component -->
    <div class="fade-step-3 w-full max-w-sm sm:max-w-md mt-8 px-4">
      <div class="flex justify-between items-center text-[11px] mb-1.5 font-mono">
        <span class="text-slate-400 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#9cd462]"></span>
          BOOTSTRAPPING ROOTFS
        </span>
        <span id="percentageCounter" class="text-[#9cd462] font-bold">68%</span>
      </div>
      <div class="w-full h-1.5 bg-[#171a25] rounded-full overflow-hidden border border-[#9cd462]/20 p-[1px]">
        <div class="h-full bg-gradient-to-r from-[#6e9b3a] via-[#9cd462] to-[#c7f495] rounded-full splash-progress-fill shadow-[0_0_10px_#9cd462]"></div>
      </div>
    </div>

  </main>

  <!-- Bottom Hardware & System Specs Bar -->
  <footer class="w-full relative z-30 pb-6 px-6 max-w-xl mx-auto flex flex-col items-center gap-3 fade-step-3">
    <div class="w-full flex items-center justify-between text-[11px] text-slate-500 font-mono border-t border-[#9cd462]/15 pt-3">
      <div class="flex items-center gap-2">
        <span class="text-[#9cd462]">KERNEL</span>
        <span class="text-slate-400">6.6.21-android14</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[#9cd462]">MEMORY</span>
        <span class="text-slate-400">4.2 / 8.0 GB</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[#9cd462]">GPU</span>
        <span class="text-slate-400">Vulkan VirGL</span>
      </div>
    </div>
    
    <div class="text-[10px] text-slate-600 tracking-wider font-mono">
      PRESS ANYWHERE TO SKIP INTRO // TOUCH TO ENTER PROMPT
    </div>
  </footer>

  <script>
    // Live boot status ticker cycling for realistic terminal ambiance
    const statusMessages = [
      "Initializing hardware bridge & Wayland socket...",
      "Mounting /dev/pts and virtual sysfs nodes...",
      "Verifying pacman archlinux-keyring integrity...",
      "Configuring VirGL hardware acceleration...",
      "Starting D-Bus message bus daemon...",
      "Ready to launch Andromarchy user session."
    ];
    let msgIndex = 0;
    const typewriterEl = document.getElementById("typewriterText");
    const percentEl = document.getElementById("percentageCounter");

    setInterval(() => {
      msgIndex = (msgIndex + 1) % statusMessages.length;
      if (typewriterEl) {
        typewriterEl.style.opacity = '0';
        setTimeout(() => {
          typewriterEl.textContent = statusMessages[msgIndex];
          typewriterEl.style.opacity = '1';
        }, 200);
      }
    }, 2400);

    // Dynamic counter increment up to 100%
    let progress = 68;
    setInterval(() => {
      if (progress < 100) {
        progress = Math.min(100, progress + Math.floor(Math.random() * 4) + 1);
        if (percentEl) {
          percentEl.textContent = progress + "%";
        }
      }
    }, 450);
  </script>
</body>
</html>
